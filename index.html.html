   <style>
    .header-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 20px;
        margin: 20px 30px 0 0;
    }
    .main-top-title {
        font-size: 32px;
        color: #2c3e50;
        margin: 0;
        animation: slideInFromRight 1s ease-out forwards;
    }

    .cool-btn {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%); 
        color: white;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0, 131, 176, 0.3);
        cursor: pointer;
        animation: pulseButton 2s infinite ease-in-out;
    }
    .cool-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(22, 170, 219, 0.5);
    }
    @keyframes pulseButton {
        0% {
            transform: scale(1);
            box-shadow: 0 4px 15px rgba(0, 131, 176, 0.3);
        }
        50% {
            transform: scale(1.05); 
            box-shadow: 0 6px 22px rgba(0, 131, 176, 0.6); 
        }
        100% {
            transform: scale(1);
            box-shadow: 0 4px 15px rgba(0, 131, 176, 0.3);
        }
    }
    @keyframes slideInFromRight {
        0% {
            opacity: 0;
            transform: translateX(50px);
        }
        100% {
            opacity: 1;
            transform: translateX(0);
        }
    }
</style>

<style>

.attractive-btn {
  /* تحديد الموقع في أقصى اليمين العلوي */
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;

  /* إلغاء تنسيقات الرابط وتنسيق النص */
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px; /* مسافة بين الرمز والنص */

  /* التصميم والألوان */
  background: linear-gradient(135deg, #ff007f, #7928ca);
  color: white;
  padding: 14px 30px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 50px;
  
  /* تأثير التوهج */
  box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), 0 5px 20px rgba(121, 40, 202, 0.3);
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* التأثير عند مرور الماوس */
.attractive-btn:hover {
  transform: scale(1.08) translateY(-2px);
  box-shadow: 0 0 25px rgba(255, 0, 127, 0.7), 0 8px 25px rgba(121, 40, 202, 0.5);
  background: linear-gradient(135deg, #7928ca, #ff007f);
}

/* التأثير عند الضغط */
.attractive-btn:active {
  transform: scale(0.98) translateY(1px);
}
</style>
